<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nav-AR: Manual & Obstacle Detection</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: -1; }
        
        #ui-container {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 10;
        }
        input {
            width: 100%; padding: 15px 25px; border-radius: 30px; border: 2px solid #00f2ff;
            background: rgba(0, 0, 0, 0.8); color: white; font-size: 16px; outline: none;
            backdrop-filter: blur(10px); pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #status-pill {
            margin-top: 15px; padding: 10px 20px; border-radius: 20px;
            background: rgba(0,0,0,0.7); color: #00f2ff; font-size: 11px;
            text-transform: uppercase; letter-spacing: 1.5px; display: inline-block;
            transition: all 0.3s ease; border: 1px solid transparent;
        }
        .warning { color: #ff3333 !important; border-color: #ff3333 !important; background: rgba(255,0,0,0.2) !important; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    
    <div id="ui-container">
        <input type="text" id="dest-input" placeholder="Escribe destino (ej: Calle Mayor)...">
        <center><div id="status-pill">ESPERANDO DESTINO</div></center>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- CONFIGURACIÓN THREE.JS ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let routeLine = null;
        let isNavigating = false;

        function createPath() {
            if (routeLine) scene.remove(routeLine);
            const points = [];
            for (let i = 0; i <= 25; i++) {
                points.push(new THREE.Vector3(Math.sin(i * 0.4) * 1.5, -4, -i * 2.5));
            }
            const curve = new THREE.CatmullRomCurve3(points);
            const geometry = new THREE.TubeGeometry(curve, 100, 0.15, 8, false);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x00f2ff, emissive: 0x0044ff, transparent: true, opacity: 0 
            });
            routeLine = new THREE.Mesh(geometry, material);
            scene.add(routeLine);
            isNavigating = true;
        }

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        camera.position.z = 1;

        // --- INTERFAZ MANUAL ---
        const input = document.getElementById('dest-input');
        const statusPill = document.getElementById('status-pill');

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                input.blur();
                statusPill.innerText = "BUSCANDO CARRETERA...";
                createPath();
            }
        });

        // --- IA: SEGUIMIENTO Y OBSTÁCULOS ---
        let faceLandmarker;
        const video = document.getElementById("video");

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task` },
                runningMode: "VIDEO", numFaces: 1
            });
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.onloadeddata = () => animate();
        }

        function animate() {
            const results = faceLandmarker.detectForVideo(video, performance.now());

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const nose = results.faceLandmarks[0][1];
                const distance = results.faceLandmarks[0][1].z; // Estimación de profundidad

                if (isNavigating) {
                    const isLookingDown = nose.y > 0.6;
                    const isObstacle = distance < -0.06; // Umbral de proximidad

                    if (isObstacle) {
                        routeLine.material.color.setHex(0xff0000);
                        routeLine.material.opacity = 1;
                        statusPill.innerText = "⚠️ OBSTÁCULO CERCANO";
                        statusPill.classList.add('warning');
                    } else if (isLookingDown) {
                        routeLine.material.color.setHex(0x00f2ff);
                        routeLine.material.opacity += (0.8 - routeLine.material.opacity) * 0.1;
                        statusPill.innerText = "SIGUIENDO RUTA";
                        statusPill.classList.remove('warning');
                    } else {
                        routeLine.material.opacity += (0 - routeLine.material.opacity) * 0.1;
                        statusPill.innerText = "ENFOCA LA CARRETERA";
                        statusPill.classList.remove('warning');
                    }
                }

                // Perspectiva dinámica basada en cabeza
                camera.position.x += ((0.5 - nose.x) * 4 - camera.position.x) * 0.1;
                camera.lookAt(0, -6, -20);
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
