<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        #ui { position: fixed; top: 0; width: 100%; z-index: 9999; text-align: center; padding: 20px; }
        button { padding: 15px; background: #00f2ff; border: none; font-weight: bold; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #debug { position: fixed; bottom: 10px; left: 10px; color: lime; background: rgba(0,0,0,0.7); font-family: monospace; font-size: 12px; z-index: 9999; }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="ui">
        <button id="btn">ACTIVAR SENSORES Y RUTA</button>
    </div>
    <div id="debug">Sensor: Apagado</div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-entity id="world">
            <a-entity id="ruta"></a-entity>
        </a-entity>
        <a-camera id="main-cam" look-controls="enabled: true"></a-camera>
    </a-scene>

    <script>
        const btn = document.getElementById('btn');
        const debug = document.getElementById('debug');
        const ruta = document.getElementById('ruta');
        const world = document.getElementById('world');

        btn.onclick = () => {
            // Intentar activar el sensor manualmente
            if (typeof DeviceOrientationEvent !== 'undefined') {
                window.addEventListener('deviceorientationabsolute', (e) => {
                    let alpha = e.alpha; // Brújula
                    let beta = e.beta;   // Inclinación
                    debug.innerText = `Giro: ${Math.round(alpha)}° | Incl: ${Math.round(beta)}°`;
                    
                    // Si el sensor funciona, movemos la ruta para que sea estática
                    if(alpha !== null) {
                        // Aplicamos la rotación inversa al "mundo" para que la línea se quede fija
                        world.setAttribute('rotation', `0 ${alpha} 0`);
                    }
                }, true);
            }
            
            crearFlechas();
            btn.style.display = 'none';
        };

        function crearFlechas() {
            ruta.innerHTML = '';
            for (let i = 1; i <= 6; i++) {
                let box = document.createElement('a-box');
                // Colocamos las flechas a 10 metros bajo el nivel de los ojos (suelo)
                box.setAttribute('position', `0 -10 ${-i * 5}`);
                box.setAttribute('width', '1');
                box.setAttribute('height', '0.1');
                box.setAttribute('depth', '2');
                box.setAttribute('color', '#00f2ff');
                box.setAttribute('material', 'emissive: #00f2ff; emissiveIntensity: 2');
                ruta.appendChild(box);
            }
        }
    </script>
</body>
</html>
