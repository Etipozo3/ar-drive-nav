<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GPS AR: Horizonte Real</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: center; justify-content: center;
        }
        button { padding: 20px; border-radius: 50px; border: none; background: #00f2ff; font-weight: bold; }
        #ui { position: fixed; top: 20px; width: 100%; text-align: center; display: none; }
        input { padding: 10px; border-radius: 20px; width: 70%; border: 2px solid #00f2ff; }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="start">INICIAR GPS AR</button>
    </div>

    <video id="video" autoplay playsinline></video>
    
    <div id="ui">
        <input type="text" id="dest" placeholder="Destino...">
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, routeLine;
        let isMoving = false;

        const startBtn = document.getElementById('start');
        
        startBtn.onclick = async () => {
            // Solicitar permisos de orientación (Crucial para que la línea se quede en el suelo)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                await DeviceOrientationEvent.requestPermission();
            }
            
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            init();
        };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Cámara trasera
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => { document.getElementById('video').srcObject = stream; });

            // Sensor de movimiento: Esto hace que la línea "se quede" en el suelo
            window.addEventListener('deviceorientation', (e) => {
                // Convertimos la rotación del móvil a la rotación de la cámara 3D
                const alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0; // Norte
                const beta = e.beta ? THREE.MathUtils.degToRad(e.beta) : 0;   // Inclinación
                const gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0; // Balanceo

                camera.rotation.set(beta, gamma, alpha, 'YZX');
            });

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            scene.add(light);

            animate();
        }

        document.getElementById('dest').onkeypress = (e) => {
            if (e.key === 'Enter') {
                e.target.blur();
                createPath();
            }
        };

        function createPath() {
            if (routeLine) scene.remove(routeLine);
            
            const points = [];
            // La línea se crea en el "mundo", no en la pantalla
            for (let i = 0; i < 50; i++) {
                points.push(new THREE.Vector3(
                    Math.sin(i * 0.2) * 3, 
                    -10, // Muy abajo para que parezca el suelo real
                    -i * 5 // Se extiende hacia el horizonte
                ));
            }

            const curve = new THREE.CatmullRomCurve3(points);
            const geometry = new THREE.TubeGeometry(curve, 100, 0.3, 8, false);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x00f2ff, 
                emissive: 0x0044ff,
                transparent: true, 
                opacity: 0.8 
            });

            routeLine = new THREE.Mesh(geometry, material);
            scene.add(routeLine);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
