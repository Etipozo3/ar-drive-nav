<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js AR Giroscopio</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        #btn-start {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 30px; font-size: 18px; z-index: 10; cursor: pointer;
            background: #007bff; color: white; border: none; border-radius: 8px;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <button id="btn-start">Iniciar Experiencia</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { DeviceOrientationControls } from 'three/addons/controls/DeviceOrientationControls.js';

        let scene, camera, renderer, controls, cube;
        const btn = document.getElementById('btn-start');

        async function init() {
            // 1. Cámara del móvil (Fondo)
            const video = document.getElementById('video');
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { exact: "environment" } } 
            });
            video.srcObject = stream;

            // 2. Escena Three.js
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 3. Controles de Orientación (Giroscopio)
            controls = new DeviceOrientationControls(camera);

            // 4. El Objeto "Quieto"
            // Lo ponemos un poco alejado (z = -5) para que lo veas al frente al empezar
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshNormalMaterial();
            cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 0, -5); 
            scene.add(cube);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update(); // Actualiza la rotación de la cámara según el sensor
            renderer.render(scene, camera);
        }

        // Manejo de permisos para iOS y activación
        btn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            btn.style.display = 'none';
                            init();
                        }
                    })
                    .catch(console.error);
            } else {
                // Para Android o navegadores que no requieren permiso explícito
                btn.style.display = 'none';
                init();
            }
        });
    </script>
</body>
</html>
