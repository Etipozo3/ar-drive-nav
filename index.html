<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR Pro - Multi-Arrow Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-top { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; z-index: 10000; }
        #destination { width: 100%; padding: 14px; border-radius: 25px; border: 2px solid #1a73e8; font-size: 16px; box-sizing: border-box; outline: none; }
        
        #map-container { position: fixed; bottom: 15px; right: 15px; width: 150px; height: 150px; border-radius: 20px; border: 3px solid white; z-index: 9999; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        #map { width: 100%; height: 100%; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 11000; display: flex; align-items: center; justify-content: center; }
        button#start-btn { padding: 15px 30px; border-radius: 30px; border: none; background: #1a73e8; color: white; font-weight: bold; font-size: 18px; }
    </style>
</head>

<body>
    <div id="overlay"><button id="start-btn" onclick="iniciarApp()">INICIAR NAVEGACIÓN</button></div>

    <div id="ui-top">
        <input type="text" id="destination" placeholder="Escribe tu destino...">
    </div>

    <div id="map-container"><div id="map"></div></div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-projected-camera rotation-reader></a-camera>
        <a-entity id="ar-route-container"></a-entity>
    </a-scene>

    <script>
        let map, userMarker, destMarker, routeLine2D;
        let userCoords = null;

        function iniciarApp() {
            document.getElementById('overlay').style.display = 'none';
            initMap();
            
            navigator.geolocation.watchPosition(pos => {
                userCoords = [pos.coords.latitude, pos.coords.longitude];
                userMarker.setLatLng(userCoords);
                if (!destMarker.getLatLng().lat) map.setView(userCoords, 16);
            }, null, { enableHighAccuracy: true });
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            userMarker = L.circleMarker([0, 0], { color: '#1a73e8', radius: 8, fillOpacity: 1 }).addTo(map);
            
            const llegadaIcon = L.icon({
                iconUrl: 'https://cdn-icons-png.flaticon.com/512/1476/1476735.png',
                iconSize: [30, 30], iconAnchor: [15, 30]
            });
            destMarker = L.marker([0, 0], {icon: llegadaIcon}).addTo(map);
        }

        document.getElementById('destination').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                const geoResp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`);
                const geoData = await geoResp.json();
                
                if (geoData.length > 0) {
                    const dLat = parseFloat(geoData[0].lat);
                    const dLon = parseFloat(geoData[0].lon);
                    destMarker.setLatLng([dLat, dLon]);
                    obtenerRutaOSRM(dLat, dLon);
                }
            }
        });

        async function obtenerRutaOSRM(dLat, dLon) {
            const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${dLon},${dLat}?geometries=geojson&overview=full&steps=true`;
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.routes.length > 0) {
                const coordinates = data.routes[0].geometry.coordinates;

                // 1. MAPA: Vista inicial "Pájaro" (Salida y Llegada)
                if (routeLine2D) map.removeLayer(routeLine2D);
                routeLine2D = L.geoJSON(data.routes[0].geometry, {style: {color: '#1a73e8', weight: 6}}).addTo(map);
                map.fitBounds(routeLine2D.getBounds(), { padding: [40, 40] });

                // Zoom automático a modo calle tras 3 segundos
                setTimeout(() => {
                    map.flyTo(userCoords, 18, { duration: 2 });
                }, 3000);

                // 2. AR: Pintar MULTIPLES flechas
                generarCaminoFlechas(coordinates);
            }
        }

        function generarCaminoFlechas(coords) {
            const container = document.getElementById('ar-route-container');
            container.innerHTML = ''; // Limpiar anteriores

            // Para asegurar que se vean varias, tomamos los primeros 40 metros de la ruta
            // OSRM devuelve muchos puntos, vamos a iterar sobre ellos.
            const maxFlechas = 15; 
            const paso = Math.max(1, Math.floor(coords.length / 50)); // Saltamos puntos para espaciarlas

            for (let i = 0; i < coords.length && i < 100; i += 2) {
                const point = coords[i];
                
                // Creamos un wrapper para la posición GPS
                const entity = document.createElement('a-entity');
                entity.setAttribute('gps-projected-entity-place', `latitude: ${point[1]}; longitude: ${point[0]};`);
                
                // Creamos el plano visual de la flecha
                const visual = document.createElement('a-plane');
                visual.setAttribute('position', '0 -2 0'); // Altura del suelo
                visual.setAttribute('rotation', '-90 0 0');
                visual.setAttribute('width', '2.5');
                visual.setAttribute('height', '3.5');
                visual.setAttribute('material', {
                    src: 'https://img.icons8.com/ios-filled/100/ffffff/up.png',
                    color: '#00f2ff',
                    transparent: true,
                    opacity: 0.9,
                    shader: 'flat'
                });

                // Añadimos la animación de flujo
                visual.setAttribute('animation', {
                    property: 'position',
                    from: '0 -2 0',
                    to: '0 -2 2',
                    dur: 1000,
                    loop: true,
                    easing: 'linear'
                });

                entity.appendChild(visual);
                container.appendChild(entity);
            }
        }
    </script>
</body>
</html>
