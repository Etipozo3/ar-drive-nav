<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR Redmi: Gran Alcance</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        #search-container {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            width: 85%; z-index: 2000;
        }
        #destination { 
            width: 100%; padding: 12px; border-radius: 25px; 
            border: 2px solid #00f2ff; background: rgba(0,0,0,0.8); 
            color: white; font-size: 16px; outline: none;
        }

        #minimap-container {
            position: fixed; bottom: 20px; right: 15px;
            width: 110px; height: 110px; border-radius: 50%;
            border: 2px solid #00f2ff; overflow: hidden; z-index: 2000;
        }
        #map { width: 100%; height: 100%; }

        #gui {
            position: fixed; top: 80px; left: 10px;
            background: rgba(0, 15, 25, 0.9); color: #00f2ff;
            padding: 12px; border-radius: 12px; z-index: 1500;
            width: 200px; border: 1px solid #00f2ff;
            font-size: 11px;
        }
        .control-block { margin-bottom: 10px; }
        input[type=range] { width: 100%; accent-color: #00f2ff; }
        .val-display { float: right; color: white; }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="text" id="destination" placeholder="Escribe tu destino...">
    </div>

    <div id="minimap-container"><div id="map"></div></div>

    <div id="gui">
        <div style="text-align:center; margin-bottom:10px; font-weight:bold;">AJUSTE DE PRECISIÓN</div>
        
        <div class="control-block">
            <label>ESCALA / TAMAÑO <span id="s-val" class="val-display">1</span></label>
            <input type="range" id="input-s" min="0.5" max="5" step="0.1" value="1">
        </div>

        <div class="control-block">
            <label>DISTANCIA (Z) <span id="z-val" class="val-display">-15</span></label>
            <input type="range" id="input-z" min="-100" max="-5" step="1" value="-15">
        </div>

        <div class="control-block">
            <label>ALTURA (Y) <span id="y-val" class="val-display">-3</span></label>
            <input type="range" id="input-y" min="-15" max="5" step="0.2" value="-3">
        </div>

        <div class="control-block">
            <label>ROTACIÓN <span id="r-val" class="val-display">0</span></label>
            <input type="range" id="input-r" min="-180" max="180" step="1" value="0">
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera rotation-reader></a-camera>

        <a-entity id="map-rig" position="0 -3 -15" scale="1 1 1">
            <a-plane id="ground-map" rotation="-90 0 0" width="60" height="60" 
                     material="transparent: true; opacity: 0.6; shader: flat;"></a-plane>
            <a-entity id="neon-path"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        const rig = document.getElementById('map-rig');
        const mapPlane = document.getElementById('ground-map');
        let userCoords = null;
        let leafletMap, userMarker, routeLine2D;

        // Leaflet Minimap
        leafletMap = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(leafletMap);
        userMarker = L.circleMarker([0, 0], { color: '#00f2ff', radius: 5, fillOpacity: 1 }).addTo(leafletMap);

        // GUI Controls
        const inputs = { 
            x: { el: null, val: 0 }, // Mantengo X interno aunque no haya slider para no romper el transform
            y: document.getElementById('input-y'), 
            z: document.getElementById('input-z'), 
            r: document.getElementById('input-r'),
            s: document.getElementById('input-s') 
        };
        const displays = { y: 'y-val', z: 'z-val', r: 'r-val', s: 's-val' };

        function updateTransform() {
            rig.setAttribute('position', `0 ${inputs.y.value} ${inputs.z.value}`);
            rig.setAttribute('rotation', `0 ${inputs.r.value} 0`);
            rig.setAttribute('scale', `${inputs.s.value} ${inputs.s.value} ${inputs.s.value}`);
            
            Object.keys(displays).forEach(k => {
                document.getElementById(displays[k]).innerText = inputs[k].value;
            });
        }
        
        ['y', 'z', 'r', 's'].forEach(key => inputs[key].addEventListener('input', updateTransform));

        // GPS & Texture
        navigator.geolocation.watchPosition(pos => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            userMarker.setLatLng(userCoords);
            leafletMap.panTo(userCoords);

            // Cargamos una imagen de mapa más grande (zoom 16 para ver más área)
            const mapUrl = `https://static-maps.yandex.ru/1.x/?ll=${userCoords[1]},${userCoords[0]}&z=16&l=map&size=650,650&theme=dark`;
            mapPlane.setAttribute('material', 'src', mapUrl);
        }, null, {enableHighAccuracy: true});

        document.getElementById('destination').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`);
                const data = await resp.json();
                if (data.length > 0) {
                    dibujarRuta(data[0].lat, data[0].lon);
                    e.target.blur();
                }
            }
        });

        async function dibujarRuta(dLat, dLon) {
            const container = document.getElementById('neon-path');
            container.innerHTML = '';
            
            const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${dLon},${dLat}?geometries=geojson&overview=full`;
            const res = await fetch(url);
            const routeData = await res.json();

            if (routeData.routes.length > 0) {
                if (routeLine2D) leafletMap.removeLayer(routeLine2D);
                routeLine2D = L.geoJSON(routeData.routes[0].geometry, {style: {color: '#00f2ff', weight: 4}}).addTo(leafletMap);
                
                // Línea de neón más larga (100 unidades) para cubrir el nuevo tamaño del plano
                const neon = document.createElement('a-cylinder');
                neon.setAttribute('height', '100');
                neon.setAttribute('radius', '0.25');
                neon.setAttribute('rotation', '90 0 0');
                neon.setAttribute('material', 'color: #00f2ff; emissive: #00f2ff; emissiveIntensity: 3');
                container.appendChild(neon);
            }
        }
    </script>
</body>
</html>
