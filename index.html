<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Three.js + Webcam Control</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #video-container { position: absolute; bottom: 10px; right: 10px; width: 200px; border: 2px solid white; z-index: 10; }
        canvas { display: block; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline style="display: none;"></video>
    <canvas id="output_canvas" style="position: absolute; bottom: 10px; right: 10px; width: 200px; transform: scaleX(-1);"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- CONFIGURACIÓN DE THREE.JS ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Crear un entorno (Cubo con texturas internas)
        const geometry = new THREE.BoxGeometry(10, 10, 10);
        const material = new THREE.MeshNormalMaterial({ side: THREE.BackSide });
        const room = new THREE.Mesh(geometry, material);
        scene.add(room);

        // Añadir objetos flotantes para referencia
        for(let i=0; i<20; i++) {
            const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5), new THREE.MeshStandardMaterial({color: Math.random() * 0xffffff}));
            mesh.position.set(Math.random()*6-3, Math.random()*6-3, Math.random()*6-3);
            scene.add(mesh);
        }
        const light = new THREE.PointLight(0xffffff, 50);
        scene.add(light);

        camera.position.z = 0; // Estamos dentro de la caja

        // --- CONFIGURACIÓN DE MEDIAPIPE (Detección Facial) ---
        let faceLandmarker;
        let video = document.getElementById("video");

        async function setupFaceMesh() {
            const filesetResolver = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task` },
                runningMode: "VIDEO",
                numFaces: 1
            });
            startCamera();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.addEventListener("loadeddata", predictWebcam);
        }

        async function predictWebcam() {
            let startTimeMs = performance.now();
            const results = faceLandmarker.detectForVideo(video, startTimeMs);

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                // Obtenemos la posición de la nariz (índice 1)
                const nose = results.faceLandmarks[0][1];
                
                // Mapear la posición (0 a 1) al rango de rotación de la cámara (-0.5 a 0.5)
                // Invertimos X porque la cámara suele estar en modo espejo
                const targetX = (nose.y - 0.5) * 2; 
                const targetY = (nose.x - 0.5) * 2;

                // Suavizado de movimiento (Lerp)
                camera.rotation.x += (targetX - camera.rotation.x) * 0.1;
                camera.rotation.y += (targetY - camera.rotation.y) * 0.1;
            }

            renderer.render(scene, camera);
            window.requestAnimationFrame(predictWebcam);
        }

        setupFaceMesh();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
