<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR Pro: Voice & Landscape Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    
        /* CAJA DE DESTINO: Arreglo para Vertical y Horizontal */
        #ui-top { 
            position: fixed; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); /* Este es el truco para centrar siempre */
            width: 90%; /* Ocupa casi todo el ancho en vertical */
            max-width: 500px; /* Pero no se estira demasiado en horizontal */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            z-index: 10000; 
            gap: 10px; 
        }
    
        #destination { 
            width: 100%; /* Se adapta al contenedor centrado */
            padding: 15px; 
            border-radius: 30px; 
            border: 2px solid #00f2ff; 
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            font-size: 16px; 
            outline: none;
            box-sizing: border-box; /* Evita que el padding la ensanche de más */
        }
    
        #mode-toggle { 
            padding: 10px 20px; 
            border-radius: 20px; 
            border: none; 
            background: #1a73e8; 
            color: white; 
            font-weight: bold; 
            cursor: pointer;
        }
    
        #map-container { 
            position: fixed; 
            bottom: 15px; 
            right: 15px; 
            width: 130px; 
            height: 130px; 
            border-radius: 15px; 
            border: 3px solid white; 
            z-index: 9999; 
            overflow: hidden; 
        }
        #map { width: 100%; height: 100%; }
    
        #voice-indicator {
            position: fixed; 
            top: 130px; /* Bajado un poco para no tapar la caja */
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8); 
            color: #00f2ff; 
            padding: 8px 15px;
            border-radius: 10px; 
            font-size: 14px;
            display: none; 
            z-index: 10000;
            text-align: center;
            width: 80%;
        }
</style>
</head>

<body>
    <div id="overlay"><button onclick="iniciarApp()" style="padding: 20px; border-radius: 50px; cursor:pointer;">INICIAR NAVEGACIÓN</button></div>

    <div id="ui-top">
        <input type="text" id="destination" placeholder="¿A dónde vamos?">
        <button id="mode-toggle" onclick="toggleMode()">MODO: PEATÓN 🚶</button>
    </div>

    <div id="voice-indicator"></div>

    <div id="map-container"><div id="map"></div></div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-projected-camera rotation-reader></a-camera>
        <a-entity id="ar-route-container"></a-entity>
    </a-scene>

    <script>
        let isVehicleMode = false;
        let map, userMarker, destMarker, routeLine2D;
        let userCoords = null;
        let lastInstruction = "";

        function toggleMode() {
            isVehicleMode = !isVehicleMode;
            const btn = document.getElementById('mode-toggle');
            btn.innerText = isVehicleMode ? "MODO: VEHÍCULO 🚗" : "MODO: PEATÓN 🚶";
            btn.classList.toggle('modo-coche');
        }

        // FUNCIÓN DE VOZ (Text-to-Speech)
        function hablar(texto) {
            if (lastInstruction === texto) return; // No repetir lo mismo
            lastInstruction = texto;
            
            const msg = new SpeechSynthesisUtterance(texto);
            msg.lang = 'es-ES';
            msg.rate = 1.0;
            window.speechSynthesis.speak(msg);

            // Mostrar visualmente también
            const indicator = document.getElementById('voice-indicator');
            indicator.innerText = texto;
            indicator.style.display = 'block';
            setTimeout(() => indicator.style.display = 'none', 5000);
        }

        async function iniciarApp() {
            document.getElementById('overlay').style.display = 'none';
            initMap();
            hablar("Sistema de navegación activado. Introduzca su destino.");
            
            navigator.geolocation.watchPosition(pos => {
                userCoords = [pos.coords.latitude, pos.coords.longitude];
                userMarker.setLatLng(userCoords);
                if (destMarker.getLatLng().lat === 0) map.setView(userCoords, 16);
                verificarGiro(); 
            }, null, { enableHighAccuracy: true });
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            
            // Icono de Salida (Círculo azul)
            userMarker = L.circleMarker([0, 0], { color: '#1a73e8', radius: 8, fillOpacity: 1 }).addTo(map).bindPopup("Salida");
            
            // Icono de Llegada (Bandera roja)
            const llegadaIcon = L.icon({
                iconUrl: 'https://cdn-icons-png.flaticon.com/512/1476/1476735.png',
                iconSize: [30, 30], iconAnchor: [15, 30]
            });
            destMarker = L.marker([0, 0], {icon: llegadaIcon}).addTo(map);
        }

        document.getElementById('destination').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                const geoResp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`);
                const geoData = await geoResp.json();
                
                if (geoData.length > 0) {
                    const dLat = geoData[0].lat;
                    const dLon = geoData[0].lon;
                    destMarker.setLatLng([dLat, dLon]);
                    obtenerRutaReal(dLat, dLon);
                    hablar("Calculando ruta hacia " + query);
                }
            }
        });

        async function obtenerRutaReal(dLat, dLon) {
            const url = `https://router.project-osrm.org/route/v1/${isVehicleMode ? 'driving' : 'walking'}/${userCoords[1]},${userCoords[0]};${dLon},${dLat}?geometries=geojson&steps=true`;
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.routes.length > 0) {
                const coordinates = data.routes[0].geometry.coordinates;
                const steps = data.routes[0].legs[0].steps;

                if (routeLine2D) map.removeLayer(routeLine2D);
                routeLine2D = L.geoJSON(data.routes[0].geometry, {style: {color: '#1a73e8', weight: 6}}).addTo(map);
                map.fitBounds(routeLine2D.getBounds());

                pintarCaminoAR(coordinates);
                
                // Dar la primera instrucción
                if(steps.length > 1) {
                    setTimeout(() => hablar(steps[0].maneuver.instruction), 2000);
                }
            }
        }

        function pintarCaminoAR(points) {
            const container = document.getElementById('ar-route-container');
            container.innerHTML = '';
            points.slice(0, 25).forEach((pt, index) => {
                const el = document.createElement('a-entity');
                el.setAttribute('gps-projected-entity-place', `latitude: ${pt[1]}; longitude: ${pt[0]};`);
                el.setAttribute('position', `0 ${isVehicleMode ? -2.5 : -1.6} 0`);
                el.setAttribute('rotation', '-90 0 0');
                el.setAttribute('geometry', { primitive: 'plane', width: isVehicleMode ? 6 : 2.5, height: 4.5 });
                el.setAttribute('material', {
                    color: isVehicleMode ? '#FFD700' : '#00f2ff',
                    transparent: true, opacity: 0.7,
                    src: 'https://img.icons8.com/ios-filled/100/ffffff/up.png'
                });
                container.appendChild(el);
            });
        }

        // Lógica básica para simular seguimiento de voz según el siguiente paso
        function verificarGiro() {
            // En una app real, aquí compararíamos nuestra posición con la del próximo "step" de la API de OSRM
            // para disparar la voz justo antes del giro.
        }
    </script>
</body>
</html>
