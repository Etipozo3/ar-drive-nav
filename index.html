<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nav-AR Pro: Fixed Camera & Road</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        #ui {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 10; text-align: center;
        }
        input {
            width: 100%; padding: 15px; border-radius: 25px; border: 2px solid #00f2ff;
            background: rgba(0,0,0,0.8); color: white; outline: none;
        }
        #status {
            margin-top: 10px; color: #00f2ff; font-size: 12px; font-weight: bold;
            background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 10px;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <div id="ui">
        <input type="text" id="dest" placeholder="Destino...">
        <div id="status">BUSCANDO CARRETERA</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let routeLine = null;
        let isNavigating = false;

        function createRoute() {
            if (routeLine) scene.remove(routeLine);
            const points = [];
            for (let i = 0; i <= 20; i++) points.push(new THREE.Vector3(Math.sin(i*0.3)*i*0.1, -4, -i*2.5));
            const curve = new THREE.CatmullRomCurve3(points);
            const geometry = new THREE.TubeGeometry(curve, 64, 0.15, 8, false);
            const material = new THREE.MeshPhongMaterial({ color: 0x00f2ff, emissive: 0x0044ff, transparent: true, opacity: 0 });
            routeLine = new THREE.Mesh(geometry, material);
            scene.add(routeLine);
            isNavigating = true;
        }

        scene.add(new THREE.AmbientLight(0xffffff, 1));
        camera.position.z = 2;

        const input = document.getElementById('dest');
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') { input.blur(); createRoute(); } });

        let faceLandmarker;
        const video = document.getElementById("video");

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task` },
                runningMode: "VIDEO", numFaces: 1
            });

            // --- CORRECCIÓN 1: CAMARA TRASERA ---
            const constraints = { 
                video: { facingMode: { exact: "environment" } } // Forza la cámara de atrás
            };
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                // Si falla (ej. en PC sin cam trasera), intenta la normal
                const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = fallback;
            }
            
            video.onloadeddata = () => animate();
        }

        function animate() {
            const results = faceLandmarker.detectForVideo(video, performance.now());

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const nose = results.faceLandmarks[0][1];
                
                // --- CORRECCIÓN 2: LÓGICA DE DETECCIÓN MEJORADA ---
                // Para que solo salga cuando mires al suelo, el valor de nose.y debe ser alto.
                // Ajustamos el umbral a 0.7 (más estricto que el 0.6 anterior)
                const isLookingAtRoad = nose.y > 0.7; 

                if (isNavigating) {
                    if (isLookingAtRoad) {
                        routeLine.material.opacity += (0.8 - routeLine.material.opacity) * 0.1;
                        document.getElementById('status').innerText = "CARRETERA DETECTADA";
                    } else {
                        routeLine.material.opacity += (0 - routeLine.material.opacity) * 0.1;
                        document.getElementById('status').innerText = "ENFOCA EL SUELO";
                    }
                }

                // Ajuste de vista
                camera.position.x += ((0.5 - nose.x) * 4 - camera.position.x) * 0.1;
                camera.lookAt(0, -6, -20);
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
