<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR Redmi: Modo Limpio</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* Buscador minimalista */
        #search-container {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            width: 80%; z-index: 2000;
        }
        #destination { 
            width: 100%; padding: 12px 20px; border-radius: 30px; 
            border: 1px solid #00f2ff; background: rgba(0,0,0,0.6); 
            color: white; font-size: 16px; outline: none; text-align: center;
        }

        /* Minimapa circular */
        #minimap-container {
            position: fixed; bottom: 20px; right: 20px;
            width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid #00f2ff; overflow: hidden; z-index: 2000;
            opacity: 0.8;
        }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="text" id="destination" placeholder="Introduce destino...">
    </div>

    <div id="minimap-container"><div id="map"></div></div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera rotation-reader></a-camera>

        <a-entity id="map-rig">
            <a-plane id="ground-map" rotation="-90 0 0" width="120" height="120" 
                     material="transparent: true; opacity: 0.4; shader: flat;"></a-plane>
            <a-entity id="neon-path"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        // ==========================================
        // CONFIGURACIÓN MANUAL (Pon aquí tus datos)
        // ==========================================
        const MIS_AJUSTES = {
            posX: 0,      // Desplazamiento lateral
            posY: -4,     // Altura (negativo es hacia el suelo)
            posZ: -20,    // Distancia hacia el horizonte
            rotY: 0,      // Giro del mapa para alinear con la calle
            escala: 2.0   // Tamaño general del mapa y ruta
        };
        // ==========================================

        const rig = document.getElementById('map-rig');
        const mapPlane = document.getElementById('ground-map');
        const pathContainer = document.getElementById('neon-path');
        let userCoords = null;
        let leafletMap, userMarker, routeLine2D;

        // Aplicar ajustes manuales al cargar
        function aplicarConfig() {
            rig.setAttribute('position', `${MIS_AJUSTES.posX} ${MIS_AJUSTES.posY} ${MIS_AJUSTES.posZ}`);
            rig.setAttribute('rotation', `0 ${MIS_AJUSTES.rotY} 0`);
            rig.setAttribute('scale', `${MIS_AJUSTES.escala} ${MIS_AJUSTES.escala} ${MIS_AJUSTES.escala}`);
        }
        aplicarConfig();

        // Inicializar Minimapa Leaflet
        leafletMap = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(leafletMap);
        userMarker = L.circleMarker([0, 0], { color: '#00f2ff', radius: 4 }).addTo(leafletMap);

        // GPS y actualización de textura
        navigator.geolocation.watchPosition(pos => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            userMarker.setLatLng(userCoords);
            leafletMap.panTo(userCoords);
            
            const mapUrl = `https://static-maps.yandex.ru/1.x/?ll=${userCoords[1]},${userCoords[0]}&z=15&l=map&size=650,650&theme=dark`;
            mapPlane.setAttribute('material', 'src', mapUrl);
        }, null, {enableHighAccuracy: true});

        // Lógica de búsqueda
        document.getElementById('destination').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${e.target.value}`);
                const data = await resp.json();
                if (data.length > 0) {
                    dibujarRuta(data[0].lat, data[0].lon);
                    e.target.blur(); // Cierra el teclado
                }
            }
        });

        async function dibujarRuta(dLat, dLon) {
            pathContainer.innerHTML = '';
            const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${dLon},${dLat}?geometries=geojson&overview=full`;
            const res = await fetch(url);
            const routeData = await res.json();

            if (routeData.routes.length > 0) {
                if (routeLine2D) leafletMap.removeLayer(routeLine2D);
                routeLine2D = L.geoJSON(routeData.routes[0].geometry, {style: {color: '#00f2ff', weight: 4}}).addTo(leafletMap);
                
                const coords = routeData.routes[0].geometry.coordinates;
                // Dibujamos los primeros 30 segmentos siguiendo la carretera
                for (let i = 0; i < coords.length - 1 && i < 30; i++) {
                    let x1 = (coords[i][0] - userCoords[1]) * 15000;
                    let z1 = (coords[i][1] - userCoords[0]) * -15000;
                    let x2 = (coords[i+1][0] - userCoords[1]) * 15000;
                    let z2 = (coords[i+1][1] - userCoords[0]) * -15000;

                    const segment = document.createElement('a-cylinder');
                    const dx = x2 - x1;
                    const dz = z2 - z1;
                    const distance = Math.sqrt(dx*dx + dz*dz);
                    
                    segment.setAttribute('position', `${(x1+x2)/2} 0.1 ${(z1+z2)/2}`);
                    segment.setAttribute('radius', '0.2');
                    segment.setAttribute('height', distance);
                    segment.setAttribute('rotation', `90 ${Math.atan2(dx, dz) * 180 / Math.PI} 0`);
                    segment.setAttribute('material', 'color: #00f2ff; emissive: #00f2ff; emissiveIntensity: 2');
                    
                    pathContainer.appendChild(segment);
                }
            }
        }
    </script>
</body>
</html>
