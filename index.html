<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Road Detection AR Navigation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: -1; }
        
        #hud {
            position: absolute; top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center;
            pointer-events: none;
        }
        #status-pill {
            background: rgba(0, 0, 0, 0.7); color: #00f2ff; padding: 10px 20px;
            border-radius: 20px; border: 1px solid #00f2ff; font-size: 12px;
            text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s;
        }
        .active { box-shadow: 0 0 15px #00f2ff; background: rgba(0, 242, 255, 0.2) !important; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    
    <div id="hud">
        <div id="status-pill">Escaneando Carretera...</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let routeLine = null;
        const statusPill = document.getElementById('status-pill');

        // --- CREACIÓN DE LA RUTA ---
        function createRoadRoute() {
            const points = [];
            for (let i = 0; i <= 15; i++) {
                points.push(new THREE.Vector3(Math.sin(i * 0.4) * 1.5, -4, -i * 3));
            }
            const curve = new THREE.CatmullRomCurve3(points);
            const geometry = new THREE.TubeGeometry(curve, 64, 0.15, 8, false);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x00f2ff, emissive: 0x0044ff, transparent: true, opacity: 0 
            });
            routeLine = new THREE.Mesh(geometry, material);
            scene.add(routeLine);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 1));
        camera.position.set(0, 0, 0);

        // --- DETECCIÓN Y ANIMACIÓN ---
        let faceLandmarker;
        const video = document.getElementById("video");

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task` },
                runningMode: "VIDEO", numFaces: 1
            });
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            createRoadRoute();
            animate();
        }

        function animate() {
            const results = faceLandmarker.detectForVideo(video, performance.now());

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const nose = results.faceLandmarks[0][1];
                
                // LÓGICA DE ACTIVACIÓN:
                // Si la nariz está en la mitad inferior (nose.y > 0.6), asumimos que miras la carretera
                const lookingAtRoad = nose.y > 0.55;

                if (lookingAtRoad) {
                    routeLine.material.opacity += (0.8 - routeLine.material.opacity) * 0.1;
                    statusPill.innerText = "Carretera Detectada - Siguiendo Ruta";
                    statusPill.classList.add('active');
                } else {
                    routeLine.material.opacity += (0 - routeLine.material.opacity) * 0.1;
                    statusPill.innerText = "Enfoca hacia abajo para ver la ruta";
                    statusPill.classList.remove('active');
                }

                // Ajuste de perspectiva
                const tx = (0.5 - nose.x) * 5;
                camera.position.x += (tx - camera.position.x) * 0.1;
                camera.lookAt(0, -5, -15);
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
