<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Three.js AR - Cámara</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>

    <!-- Importamos Three.js desde un CDN -->
    <script type="module">
        import * as THREE from 'https://unpkg.com';
        import { ARButton } from 'https://unpkg.com';

        let camera, scene, renderer, cube;

        init();
        animate();

        function init() {
            // 1. Crear la Escena
            scene = new THREE.Scene();

            // 2. Configurar la Cámara
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // 3. Configurar el Renderer con Transparencia (Alpha)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // Habilitar soporte XR
            document.body.appendChild(renderer.domElement);

            // 4. Añadir el Botón de AR (Cámara)
            // Este botón pedirá permiso para usar la cámara al hacer click
            document.body.appendChild(ARButton.createButton(renderer));

            // 5. Crear un Objeto de Prueba (un Cubo)
            const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1); // 10cm
            const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
            cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 0, -0.5); // Medio metro frente al usuario
            scene.add(cube);

            // 6. Añadir Luz para poder ver el objeto
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            scene.add(light);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 7. Bucle de Animación (usando setAnimationLoop para XR)
        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // Rotar el cubo para que se vea que es 3D
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
