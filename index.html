<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GPS AR Pro - Proyecto Final</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* Contenedor del Mapa 2D (Abajo Derecha) */
        #map-container {
            position: fixed; bottom: 20px; right: 20px;
            width: 150px; height: 150px;
            border-radius: 50%; border: 3px solid #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            z-index: 9999; overflow: hidden;
            background: #000;
        }
        #map { width: 100%; height: 100%; }

        /* Interfaz de Usuario */
        #ui-top {
            position: fixed; top: 20px; width: 100%; text-align: center; z-index: 10000;
        }
        input {
            width: 70%; padding: 12px; border-radius: 25px; border: 2px solid #00f2ff;
            background: rgba(0,0,0,0.8); color: white; outline: none;
        }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 11000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        button {
            padding: 15px 30px; background: #00f2ff; border: none; border-radius: 50px;
            font-weight: bold; font-size: 16px; cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="overlay">
        <h1 style="color: white; margin-bottom: 20px;">NAV-AR PRO</h1>
        <button onclick="startApp()">ACTIVAR SISTEMAS</button>
        <p style="color: #666; font-size: 11px; margin-top: 15px;">GPS + SENSORES + CÁMARA</p>
    </div>

    <div id="ui-top">
        <input type="text" id="destination" placeholder="Introduce destino...">
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        
        <a-camera gps-camera rotation-reader look-controls="enabled: true; magicWindowTrackingEnabled: true;"></a-camera>

        <a-entity id="ar-world">
            <a-entity id="route-line"></a-entity>
        </a-entity>

    </a-scene>

    <script>
        let map, marker, userCoords;
        const routeContainer = document.getElementById('route-line');

        async function startApp() {
            // Solicitar permisos de sensores (Necesario en Redmi/Android)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                await DeviceOrientationEvent.requestPermission();
            }
            
            document.getElementById('overlay').style.display = 'none';
            initMap();
            watchPosition();
        }

        // --- MÓDULO 1: MAPA REAL 2D ---
        function initMap() {
            // Estilo oscuro tipo "Modo Avión/Navegación"
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0, 0], 18);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            marker = L.circleMarker([0, 0], { color: '#00f2ff', radius: 5, fillOpacity: 1 }).addTo(map);
        }

        function watchPosition() {
            navigator.geolocation.watchPosition((pos) => {
                userCoords = [pos.coords.latitude, pos.coords.longitude];
                map.setView(userCoords, 18);
                marker.setLatLng(userCoords);
            }, (err) => console.error(err), { enableHighAccuracy: true });
        }

        // --- MÓDULO 2: LÍNEA AR SOLAPADA ---
        document.getElementById('destination').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.target.blur();
                drawARRoute();
            }
        });

        function drawARRoute() {
            routeContainer.innerHTML = '';
            
            // Creamos una línea de flechas que parecen solaparse en el suelo
            // Usamos un bucle para crear "segmentos" de carretera virtual
            for (let i = 1; i <= 15; i++) {
                const segment = document.createElement('a-entity');
                
                // Posición: i*4 metros hacia adelante, -1.6 metros (altura estándar del suelo)
                segment.setAttribute('position', `0 -1.6 ${-i * 4}`);
                segment.setAttribute('rotation', '-90 0 0'); // Tumbado en el suelo
                
                segment.setAttribute('geometry', {
                    primitive: 'plane',
                    width: 2.5,
                    height: 3
                });

                // Material con "Glow" para que destaque sobre el asfalto real
                segment.setAttribute('material', {
                    src: 'https://img.icons8.com/ios-filled/100/ffffff/chevron-up.png', // Icono flecha
                    color: '#00f2ff',
                    transparent: true,
                    opacity: 0.7,
                    shader: 'flat',
                    emissive: '#00f2ff',
                    emissiveIntensity: 0.5
                });

                // Animación de flujo
                segment.setAttribute('animation', {
                    property: 'position',
                    to: `0 -1.6 ${-(i * 4) + 2}`,
                    dur: 1000,
                    loop: true,
                    easing: 'linear'
                });

                routeContainer.appendChild(segment);
            }
        }
    </script>
</body>
</html>
