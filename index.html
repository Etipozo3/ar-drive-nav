<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Three.js AR Background</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        /* El video ahora ocupa toda la pantalla de fondo */
        #video {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover; /* Mantiene la proporción sin deformar */
            transform: scaleX(-1); /* Efecto espejo */
            z-index: -1; /* Lo envía al fondo */
        }
        canvas { display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="loading">Iniciando Realidad Aumentada...</div>
    <video id="video" autoplay playsinline></video>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- 1. CONFIGURACIÓN DE THREE.JS ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // IMPORTANTE: alpha: true para transparencia
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); // Fondo 100% transparente
        document.body.appendChild(renderer.domElement);

        // Añadir una rejilla en el suelo (opcional, para referencia)
        const grid = new THREE.GridHelper(20, 20, 0x00ff88, 0x00ff88);
        grid.position.y = -2;
        grid.material.opacity = 0.5;
        grid.material.transparent = true;
        scene.add(grid);

        // Añadir varios cubos de colores flotando
        for (let i = 0; i < 15; i++) {
            const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const mat = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
            const cube = new THREE.Mesh(geo, mat);
            cube.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*5);
            scene.add(cube);
        }

        const light = new THREE.DirectionalLight(0xffffff, 3);
        light.position.set(1, 1, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        camera.position.z = 5;

        // --- 2. CONFIGURACIÓN DE IA ---
        let faceLandmarker;
        const video = document.getElementById("video");
        const loadingDiv = document.getElementById("loading");

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task` },
                runningMode: "VIDEO",
                numFaces: 1
            });
            startCamera();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.onloadeddata = () => {
                loadingDiv.style.display = "none";
                animate();
            };
        }

        function animate() {
            const results = faceLandmarker.detectForVideo(video, performance.now());

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const nose = results.faceLandmarks[0][1];
                
                // Mover la cámara según tu cabeza
                const targetX = (0.5 - nose.x) * 8;
                const targetY = (0.5 - nose.y) * 5;

                camera.position.x += (targetX - camera.position.x) * 0.1;
                camera.position.y += (targetY - camera.position.y) * 0.1;
                camera.lookAt(0, 0, 0);
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
