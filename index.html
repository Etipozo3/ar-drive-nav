<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR: Espacio Local Pro</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #info {
            position: fixed; top: 10px; left: 10px; z-index: 100;
            background: rgba(0,0,0,0.7); color: #00f2ff;
            padding: 10px; border-radius: 8px; font-size: 12px;
            border: 1px solid #00f2ff;
        }
        #search {
            position: fixed; top: 10px; right: 10px; z-index: 100;
            width: 150px; padding: 10px; border-radius: 20px;
            background: rgba(0,0,0,0.8); color: white; border: 1px solid #00f2ff;
        }
    </style>
</head>
<body>

    <div id="info">
        GPS: <span id="gps-status">Esperando...</span><br>
        Offset: <span id="offset-val">0, 0</span>m
    </div>

    <input type="text" id="search" placeholder="Destino...">

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-entity id="camera-rig">
            <a-camera rotation-reader></a-camera>
        </a-entity>

        <a-entity id="mundo-fijo" position="0 -4 -20" scale="3 3 3" rotation="0 0 0">
            
            <a-plane id="map-plane" rotation="-90 0 0" width="100" height="100" 
                     material="transparent: true; opacity: 0.5; shader: flat;"></a-plane>
            
            <a-entity id="path-container"></a-entity>
            
        </a-entity>

    </a-scene>

    <script>
        const cameraRig = document.getElementById('camera-rig');
        const mapPlane = document.getElementById('map-plane');
        const gpsStatus = document.getElementById('gps-status');
        const offsetVal = document.getElementById('offset-val');

        let originCoords = null; // Tu punto de partida

        // Función matemática para convertir GPS a metros (Escena local)
        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6378137; // Radio de la Tierra
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const x = dLon * Math.cos((lat1 + lat2) / 2 * Math.PI / 180) * R;
            const z = dLat * R;
            return { x: x, z: -z }; // Z negativa hacia adelante en Three.js
        }

        navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            gpsStatus.innerText = `Precisión: ${accuracy.toFixed(1)}m`;

            if (!originCoords) {
                // ANCLAJE INICIAL: Guardamos donde empezaste
                originCoords = { lat: latitude, lon: longitude };
                
                // Cargamos la textura del mapa basada en este origen
                const mapUrl = `https://static-maps.yandex.ru/1.x/?ll=${longitude},${latitude}&z=16&l=map&size=600,600&theme=dark`;
                mapPlane.setAttribute('material', 'src', mapUrl);
            }

            // Calculamos cuánto te has movido respecto al origen
            const meters = getDistanceInMeters(
                originCoords.lat, originCoords.lon,
                latitude, longitude
            );

            // MOVEMOS AL USUARIO, EL MAPA SE QUEDA QUIETO
            cameraRig.setAttribute('position', `${meters.x} 0 ${meters.z}`);
            offsetVal.innerText = `${meters.x.toFixed(1)}, ${meters.z.toFixed(1)}`;

        }, err => console.error(err), {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        });

        // Lógica de búsqueda (idéntica a las anteriores)
        document.getElementById('search').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`);
                const data = await resp.json();
                if (data.length > 0) dibujarRuta(data[0].lat, data[0].lon);
            }
        });

        async function dibujarRuta(dLat, dLon) {
            const container = document.getElementById('path-container');
            container.innerHTML = '';
            // Aquí iría la lógica de OSRM para dibujar la línea basada en originCoords
            // Para asegurar el test, puedes poner un cilindro de prueba:
            const testLine = document.createElement('a-cylinder');
            testLine.setAttribute('height', '200');
            testLine.setAttribute('radius', '0.2');
            testLine.setAttribute('rotation', '90 0 0');
            testLine.setAttribute('material', 'color: #00f2ff; emissive: #00f2ff; emissiveIntensity: 2');
            container.appendChild(testLine);
        }
    </script>
</body>
</html>
