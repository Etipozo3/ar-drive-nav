<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR: Horizonte Largo</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #search-container { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); width: 85%; z-index: 2000; }
        #destination { width: 100%; padding: 12px; border-radius: 25px; border: 2px solid #00f2ff; background: rgba(0,0,0,0.8); color: white; outline: none; }
        #minimap-container { position: fixed; bottom: 20px; right: 15px; width: 110px; height: 110px; border-radius: 50%; border: 2px solid #00f2ff; overflow: hidden; z-index: 2000; }
        #map { width: 100%; height: 100%; }
        #gui { position: fixed; top: 80px; left: 10px; background: rgba(0, 15, 25, 0.9); color: #00f2ff; padding: 10px; border-radius: 12px; z-index: 1500; width: 190px; border: 1px solid #00f2ff; font-size: 11px; }
        .control-block { margin-bottom: 8px; }
        input[type=range] { width: 100%; accent-color: #00f2ff; }
        .val-display { float: right; color: white; }
    </style>
</head>
<body>

    <div id="search-container"><input type="text" id="destination" placeholder="Escribe destino para ver ruta larga..."></div>
    <div id="minimap-container"><div id="map"></div></div>

    <div id="gui">
        <div style="text-align:center; margin-bottom:5px; font-weight:bold;">CONTROL DE VISTA</div>
        <div class="control-block">
            <label>LARGO RUTA (Z) <span id="z-val" class="val-display">-25</span></label>
            <input type="range" id="input-z" min="-200" max="-10" step="1" value="-25">
        </div>
        <div class="control-block">
            <label>ESCALA TOTAL <span id="s-val" class="val-display">1.5</span></label>
            <input type="range" id="input-s" min="0.5" max="10" step="0.1" value="1.5">
        </div>
        <div class="control-block">
            <label>INCLINACIÓN <span id="y-val" class="val-display">-5</span></label>
            <input type="range" id="input-y" min="-20" max="5" step="0.5" value="-5">
        </div>
        <div class="control-block">
            <label>GIRO MAPA <span id="r-val" class="val-display">0</span></label>
            <input type="range" id="input-r" min="-180" max="180" step="1" value="0">
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera rotation-reader></a-camera>

        <a-entity id="map-rig" position="0 -5 -25" scale="1.5 1.5 1.5">
            <a-plane id="ground-map" rotation="-90 0 0" width="150" height="150" 
                     material="transparent: true; opacity: 0.5; shader: flat;"></a-plane>
            
            <a-entity id="neon-path"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        const rig = document.getElementById('map-rig');
        const mapPlane = document.getElementById('ground-map');
        const pathContainer = document.getElementById('neon-path');
        let userCoords = null;
        let leafletMap, userMarker, routeLine2D;

        // Leaflet
        leafletMap = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(leafletMap);
        userMarker = L.circleMarker([0, 0], { color: '#00f2ff', radius: 5, fillOpacity: 1 }).addTo(leafletMap);

        // GUI
        const inputs = { y: document.getElementById('input-y'), z: document.getElementById('input-z'), r: document.getElementById('input-r'), s: document.getElementById('input-s') };
        function updateTransform() {
            rig.setAttribute('position', `0 ${inputs.y.value} ${inputs.z.value}`);
            rig.setAttribute('rotation', `0 ${inputs.r.value} 0`);
            rig.setAttribute('scale', `${inputs.s.value} ${inputs.s.value} ${inputs.s.value}`);
            Object.keys(inputs).forEach(k => document.getElementById(k+'-val').innerText = inputs[k].value);
        }
        Object.values(inputs).forEach(i => i.addEventListener('input', updateTransform));

        navigator.geolocation.watchPosition(pos => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            userMarker.setLatLng(userCoords);
            leafletMap.panTo(userCoords);
            // Zoom 14 para ver kilómetros de mapa
            const mapUrl = `https://static-maps.yandex.ru/1.x/?ll=${userCoords[1]},${userCoords[0]}&z=14&l=map&size=650,650&theme=dark`;
            mapPlane.setAttribute('material', 'src', mapUrl);
        }, null, {enableHighAccuracy: true});

        document.getElementById('destination').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`);
                const data = await resp.json();
                if (data.length > 0) {
                    dibujarRutaLarga(data[0].lat, data[0].lon);
                    e.target.blur();
                }
            }
        });

        async function dibujarRutaLarga(dLat, dLon) {
            pathContainer.innerHTML = '';
            const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${dLon},${dLat}?geometries=geojson&overview=full`;
            const res = await fetch(url);
            const routeData = await res.json();

            if (routeData.routes.length > 0) {
                // Actualizar minimapa
                if (routeLine2D) leafletMap.removeLayer(routeLine2D);
                routeLine2D = L.geoJSON(routeData.routes[0].geometry, {style: {color: '#00f2ff', weight: 4}}).addTo(leafletMap);
                
                // Dibujar línea neón larga
                // IMPORTANTE: Dibujamos una línea 3D que sigue los puntos reales para ver las curvas
                const coords = routeData.routes[0].geometry.coordinates;
                let pointsString = "";
                
                // Tomamos los primeros 100 puntos de la ruta para ver mucha distancia
                for(let i=0; i < coords.length && i < 100; i++) {
                    // Convertimos coordenadas a metros relativos simples para visualización
                    let x = (coords[i][0] - userCoords[1]) * 10000; 
                    let z = (coords[i][1] - userCoords[0]) * -10000;
                    pointsString += `${x} 0 ${z}, `;
                }

                const line = document.createElement('a-entity');
                line.setAttribute('meshline', {
                    lineWidth: 20,
                    path: pointsString.slice(0, -2),
                    color: '#00f2ff'
                });
                // Si no tienes la librería meshline, usamos un cilindro muy largo por ahora para asegurar que funcione:
                const neon = document.createElement('a-cylinder');
                neon.setAttribute('height', '300'); // ¡Triple de largo!
                neon.setAttribute('radius', '0.3');
                neon.setAttribute('rotation', '90 0 0');
                neon.setAttribute('position', '0 0 -150');
                neon.setAttribute('material', 'color: #00f2ff; emissive: #00f2ff; emissiveIntensity: 4');
                pathContainer.appendChild(neon);
            }
        }
    </script>
</body>
</html>
