<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Three.js GPS + Head Tracking</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: -1; }
        #info { position: absolute; top: 20px; left: 20px; color: #00ff88; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #00ff88; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="info">
        <b>SISTEMA DE NAVEGACIÓN AR</b><br>
        <span id="coords">Obteniendo ubicación...</span><br>
        <span id="dest">Destino: Norte Magnético</span>
    </div>
    <video id="video" autoplay playsinline></video>

    <script type="importmap">
        {
            "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- 1. CONFIGURACIÓN DE THREE.JS ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Crear una Flecha de Navegación (GPS Pointer)
        const arrowGroup = new THREE.Group();
        const coneGeo = new THREE.ConeGeometry(0.5, 1.5, 32);
        const coneMat = new THREE.MeshPhongMaterial({ color: 0x00ff88, emissive: 0x004422 });
        const arrow = new THREE.Mesh(coneGeo, coneMat);
        arrow.rotation.x = Math.PI / 2; // Apuntar hacia adelante
        arrowGroup.add(arrow);
        scene.add(arrowGroup);

        const light = new THREE.PointLight(0xffffff, 10);
        light.position.set(0, 5, 5);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));

        camera.position.z = 5;

        // --- 2. LÓGICA GPS ---
        function updateGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((position) => {
                    const { latitude, longitude } = position.coords;
                    document.getElementById('coords').innerText = `Lat: ${latitude.toFixed(4)}, Lon: ${longitude.toFixed(4)}`;
                    
                    // Aquí podrías calcular el ángulo hacia un destino real. 
                    // Por ahora, haremos que la flecha rote suavemente.
                });
            } else {
                document.getElementById('coords').innerText = "GPS no disponible";
            }
        }

        // --- 3. LÓGICA DE IA (HEAD TRACKING) ---
        let faceLandmarker;
        const video = document.getElementById("video");

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task` },
                runningMode: "VIDEO", numFaces: 1
            });
            startCamera();
            updateGPS();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.onloadeddata = () => animate();
        }

        function animate() {
            const results = faceLandmarker.detectForVideo(video, performance.now());

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const nose = results.faceLandmarks[0][1];
                
                // Mover la cámara (Parallax)
                const targetX = (0.5 - nose.x) * 6;
                const targetY = (0.5 - nose.y) * 4;
                camera.position.x += (targetX - camera.position.x) * 0.1;
                camera.position.y += (targetY - camera.position.y) * 0.1;
                camera.lookAt(0, 0, 0);

                // La flecha flota frente a ti pero con un ligero retraso
                arrowGroup.position.x = camera.position.x * 0.5;
                arrowGroup.position.y = camera.position.y * 0.5;
            }

            // Animación constante de la flecha
            arrowGroup.rotation.z += 0.01; 

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
