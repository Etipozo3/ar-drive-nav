<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR Pro - Fix Vertical</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }

        /* BUSCADOR CORREGIDO PARA VERTICAL */
        #ui-top {
            position: fixed; top: 15px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 10000;
        }
        #destination {
            width: 85%; max-width: 400px; padding: 15px;
            border-radius: 30px; border: 2px solid #00f2ff;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 16px; outline: none; box-sizing: border-box;
        }

        /* MAPA REDIMENSIONADO */
        #map-container {
            position: fixed; bottom: 15px; right: 15px;
            width: 140px; height: 140px;
            border-radius: 15px; border: 3px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 9999; overflow: hidden;
        }
        #map { width: 100%; height: 100%; }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 11000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        button {
            padding: 15px 30px; background: #00f2ff; border: none; border-radius: 50px;
            font-weight: bold; font-size: 16px;
        }
    </style>
</head>

<body>

    <div id="overlay">
        <h2 style="color: white;">CALIBRANDO GPS...</h2>
        <button onclick="iniciarApp()">EMPEZAR</button>
    </div>

    <div id="ui-top">
        <input type="text" id="destination" placeholder="Escribe destino real (ej: Madrid)">
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-camera rotation-reader></a-camera>
        <a-entity id="ar-route-container"></a-entity>
    </a-scene>

    <script>
        let map, userMarker, destMarker, routeLine2D;
        let userCoords = null;

        async function iniciarApp() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                await DeviceOrientationEvent.requestPermission();
            }
            document.getElementById('overlay').style.display = 'none';
            initMap();
            obtenerUbicacion();
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            userMarker = L.circleMarker([0, 0], { color: '#1a73e8', radius: 7, fillOpacity: 1 }).addTo(map);
            destMarker = L.marker([0, 0]).addTo(map);
        }

        function obtenerUbicacion() {
            navigator.geolocation.watchPosition((pos) => {
                userCoords = [pos.coords.latitude, pos.coords.longitude];
                userMarker.setLatLng(userCoords);
                if (destMarker.getLatLng().lat === 0) map.setView(userCoords, 16);
                actualizarMapa();
            }, null, { enableHighAccuracy: true });
        }

        // BUSCADOR REAL (Nominatim API)
        document.getElementById('destination').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                e.target.blur();
                
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`);
                    const data = await response.json();
                    
                    if (data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        activarNavegacion(lat, lon);
                    } else {
                        alert("No se encontró el lugar");
                    }
                } catch (error) {
                    console.error("Error buscando:", error);
                }
            }
        });

        function activarNavegacion(dLat, dLon) {
            destMarker.setLatLng([dLat, dLon]);
            
            // Dibujar ruta en mapa 2D
            if (routeLine2D) map.removeLayer(routeLine2D);
            routeLine2D = L.polyline([userCoords, [dLat, dLon]], {color: '#1a73e8', weight: 4}).addTo(map);
            actualizarMapa();

            // Generar Flechas Animadas en AR
            const container = document.getElementById('ar-route-container');
            container.innerHTML = '';

            for (let i = 1; i <= 15; i++) {
                const zPos = -i * 5;
                const flecha = document.createElement('a-entity');
                flecha.setAttribute('position', `0 -1.6 ${zPos}`);
                flecha.setAttribute('rotation', '-90 0 0');
                flecha.setAttribute('geometry', { primitive: 'plane', width: 2.2, height: 3.5 });
                flecha.setAttribute('material', {
                    src: 'https://img.icons8.com/ios-filled/100/ffffff/up.png',
                    color: '#00f2ff', transparent: true, opacity: 0.8,
                    emissive: '#00f2ff', emissiveIntensity: 1
                });

                // Animación de flujo mejorada
                flecha.setAttribute('animation', {
                    property: 'position',
                    from: `0 -1.6 ${zPos}`,
                    to: `0 -1.6 ${zPos + 5}`,
                    dur: 1000,
                    loop: true,
                    easing: 'linear'
                });

                container.appendChild(flecha);
            }
        }

        function actualizarMapa() {
            if (userCoords && destMarker.getLatLng().lat !== 0) {
                const bounds = L.latLngBounds([userCoords, destMarker.getLatLng()]);
                map.fitBounds(bounds, { padding: [20, 20] });
            }
        }
    </script>
</body>
</html>
