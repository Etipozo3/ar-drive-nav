<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR 360: GUI de Precisión</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; }
        
        /* GUI LATERAL DE PRECISIÓN */
        #gui {
            position: fixed; top: 10px; right: 10px;
            background: rgba(0, 20, 30, 0.9); color: #00f2ff;
            padding: 15px; border-radius: 10px; z-index: 2000;
            width: 250px; border: 1px solid #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
            font-size: 12px;
        }
        .control-block { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #00f2ff; }
        .val-display { float: right; color: white; background: #333; padding: 2px 5px; border-radius: 3px; }

        #search-box {
            position: fixed; top: 10px; left: 10px; z-index: 2000;
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px;
        }
        #destination { 
            background: transparent; border: 1px solid #00f2ff; color: white;
            padding: 8px; border-radius: 5px; width: 150px;
        }
    </style>
</head>
<body>

    <div id="search-box">
        <input type="text" id="destination" placeholder="BUSCAR DESTINO...">
    </div>

    <div id="gui">
        <div style="text-align: center; font-weight: bold; border-bottom: 1px solid #00f2ff; margin-bottom: 10px; padding-bottom: 5px;">SISTEMA DE CALIBRACIÓN</div>
        
        <div class="control-block">
            <label>Distancia (Z): <span id="z-val" class="val-display">-10</span></label>
            <input type="range" id="input-z" min="-50" max="0" step="0.5" value="-10">
        </div>

        <div class="control-block">
            <label>Desplazamiento (X): <span id="x-val" class="val-display">0</span></label>
            <input type="range" id="input-x" min="-2000" max="20" step="0.1" value="0">
        </div>

        <div class="control-block">
            <label>Altura (Y): <span id="y-val" class="val-display">-3</span></label>
            <input type="range" id="input-y" min="-10" max="5" step="0.1" value="-3">
        </div>

        <div class="control-block">
            <label>Rotación (Y-Rot): <span id="r-val" class="val-display">0</span></label>
            <input type="range" id="input-r" min="-180" max="180" step="1" value="0">
        </div>

        <div class="control-block">
            <label>Opacidad Mapa: <span id="o-val" class="val-display">0.7</span></label>
            <input type="range" id="input-o" min="0" max="1" step="0.1" value="0.7">
        </div>
        
        <button onclick="guardarConfig()" style="width:100%; background:#00f2ff; border:none; padding:5px; font-weight:bold;">GUARDAR LOG</button>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera rotation-reader></a-camera>

        <a-entity id="map-rig" position="0 -3 -10" rotation="0 0 0">
            <a-plane id="ground-map" 
                     rotation="-90 0 0" 
                     width="40" height="40" 
                     material="transparent: true; opacity: 0.7; shader: flat;">
            </a-plane>
            
            <a-entity id="neon-path"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        const rig = document.getElementById('map-rig');
        const mapPlane = document.getElementById('ground-map');
        let userCoords = null;

        // --- LÓGICA DE CONTROL GUI ---
        const inputs = {
            x: document.getElementById('input-x'),
            y: document.getElementById('input-y'),
            z: document.getElementById('input-z'),
            r: document.getElementById('input-r'),
            o: document.getElementById('input-o')
        };

        const displays = {
            x: document.getElementById('x-val'),
            y: document.getElementById('y-val'),
            z: document.getElementById('z-val'),
            r: document.getElementById('r-val'),
            o: document.getElementById('o-val')
        };

        // Función para actualizar medidas en tiempo real
        function updateScene() {
            // Actualizar Posición
            rig.setAttribute('position', `${inputs.x.value} ${inputs.y.value} ${inputs.z.value}`);
            // Actualizar Rotación
            rig.setAttribute('rotation', `0 ${inputs.r.value} 0`);
            // Actualizar Opacidad
            mapPlane.setAttribute('material', 'opacity', inputs.o.value);
            
            // Actualizar displays de texto
            Object.keys(inputs).forEach(key => {
                displays[key].innerText = inputs[key].value;
            });
        }

        // Escuchar cambios en los sliders
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', updateScene);
        });

        function guardarConfig() {
            console.log(`CONFIGURACIÓN ACTUAL: Pos(${inputs.x.value}, ${inputs.y.value}, ${inputs.z.value}) Rot(${inputs.r.value})`);
            alert("Medidas guardadas en la consola (F12)");
        }

        // --- LÓGICA DE MAPAS Y RUTA ---
        navigator.geolocation.watchPosition(pos => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            const url = `https://static-maps.yandex.ru/1.x/?ll=${userCoords[1]},${userCoords[0]}&z=17&l=map&size=650,650&theme=dark`;
            mapPlane.setAttribute('material', 'src', url);
        }, null, {enableHighAccuracy: true});

        document.getElementById('destination').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${e.target.value}`);
                const data = await resp.json();
                if (data.length > 0) dibujarRuta(data[0].lat, data[0].lon);
            }
        });

        async function dibujarRuta(dLat, dLon) {
            const container = document.getElementById('neon-path');
            container.innerHTML = '';
            const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${dLon},${dLat}?geometries=geojson&overview=full`;
            const res = await fetch(url);
            const routeData = await res.json();

            if (routeData.routes.length > 0) {
                // Dibujamos un cilindro de neón que atraviesa el mapa ajustado
                const neonLine = document.createElement('a-cylinder');
                neonLine.setAttribute('height', '60');
                neonLine.setAttribute('radius', '0.15');
                neonLine.setAttribute('rotation', '90 0 0');
                neonLine.setAttribute('material', 'color: #00f2ff; emissive: #00f2ff; emissiveIntensity: 3');
                container.appendChild(neonLine);
            }
        }
    </script>
</body>
</html>
