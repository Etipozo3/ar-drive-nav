<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GPS-AR Profesional</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #ui {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 80%; text-align: center;
        }
        input {
            width: 100%; padding: 15px; border-radius: 30px; border: 2px solid #00f2ff;
            background: rgba(0,0,0,0.8); color: white; font-size: 16px; outline: none;
        }
        .instrucciones {
            color: white; background: rgba(0,0,0,0.5); padding: 5px; 
            border-radius: 5px; margin-top: 10px; font-family: sans-serif; font-size: 12px;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div id="ui">
        <input type="text" id="dest" placeholder="Escribe destino y pulsa Enter...">
        <div class="instrucciones">Apunta al suelo para ver las flechas de ruta</div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        
        <a-camera gps-camera rotation-reader></a-camera>

        <a-entity id="ruta-container"></a-entity>

    </a-scene>

    <script>
        const input = document.getElementById('dest');
        const container = document.getElementById('ruta-container');

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                input.blur();
                generarRutaPro();
            }
        });

        function generarRutaPro() {
            // Limpiamos ruta anterior
            container.innerHTML = '';

            // Creamos una serie de flechas que se alejan en el eje Z (hacia adelante)
            // Y están fijas en el eje Y (el suelo)
            for (let i = 1; i <= 10; i++) {
                const flecha = document.createElement('a-entity');
                
                // Posición: i*5 metros hacia adelante, -2 metros hacia abajo (suelo)
                flecha.setAttribute('position', `0 -2 ${-i * 5}`);
                flecha.setAttribute('rotation', '90 0 0'); // Tumbada en el suelo
                
                // Geometría de flecha plana
                flecha.setAttribute('geometry', {
                    primitive: 'plane',
                    width: 2,
                    height: 2
                });

                // Material con textura de flecha (cian brillante)
                flecha.setAttribute('material', {
                    color: '#00f2ff',
                    transparent: true,
                    opacity: 0.8,
                    shader: 'flat',
                    side: 'double',
                    src: 'https://img.icons8.com/ios-filled/100/ffffff/up--v1.png' // Icono de flecha
                });

                // Añadimos una animación para que la flecha "parpadee" o se mueva
                flecha.setAttribute('animation', {
                    property: 'material.opacity',
                    from: 0.3,
                    to: 0.9,
                    dur: 1000,
                    dir: 'alternate',
                    loop: true,
                    easing: 'easeInOutQuad'
                });

                container.appendChild(flecha);
            }
            console.log("Ruta generada en el espacio real");
        }
    </script>
</body>
</html>
