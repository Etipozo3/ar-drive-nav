<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR Pro - Precision Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-top { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; z-index: 10000; }
        #destination { width: 100%; padding: 15px; border-radius: 30px; border: 2px solid #00f2ff; background: rgba(255,255,255,0.9); font-size: 16px; box-sizing: border-box; outline: none; }
        #map-container { position: fixed; bottom: 15px; right: 15px; width: 140px; height: 140px; border-radius: 20px; border: 3px solid white; z-index: 9999; overflow: hidden; }
        #map { width: 100%; height: 100%; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 11000; display: flex; align-items: center; justify-content: center; }
        button { padding: 15px 30px; border-radius: 30px; border: none; background: #00f2ff; font-weight: bold; }
    </style>
</head>

<body>
    <div id="overlay"><button onclick="iniciarApp()">ACTIVAR SISTEMA DE PRECISIÓN</button></div>

    <div id="ui-top">
        <input type="text" id="destination" placeholder="Introduce destino real...">
    </div>

    <div id="map-container"><div id="map"></div></div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-projected-camera="simulateAltitude: false; gpsMinDistance: 1;" rotation-reader></a-camera>
        <a-entity id="ar-route-container"></a-entity>
    </a-scene>

    <script>
        let map, userMarker, destMarker, routeLine2D;
        let userCoords = null;

        function iniciarApp() {
            document.getElementById('overlay').style.display = 'none';
            initMap();
            
            navigator.geolocation.watchPosition(pos => {
                userCoords = [pos.coords.latitude, pos.coords.longitude];
                userMarker.setLatLng(userCoords);
                if (!destMarker.getLatLng().lat) map.setView(userCoords, 17);
            }, null, { enableHighAccuracy: true, maximumAge: 0 });
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            userMarker = L.circleMarker([0, 0], { color: '#00f2ff', radius: 8, fillOpacity: 1 }).addTo(map);
            destMarker = L.marker([0, 0]).addTo(map);
        }

        document.getElementById('destination').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const geoResp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${e.target.value}`);
                const geoData = await geoResp.json();
                if (geoData.length > 0) {
                    const dLat = parseFloat(geoData[0].lat);
                    const dLon = parseFloat(geoData[0].lon);
                    destMarker.setLatLng([dLat, dLon]);
                    obtenerRutaPro(dLat, dLon);
                }
            }
        });

        async function obtenerRutaPro(dLat, dLon) {
            // Pedimos la ruta con máxima resolución de puntos
            const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${dLon},${dLat}?geometries=geojson&overview=full`;
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.routes.length > 0) {
                const coordinates = data.routes[0].geometry.coordinates;

                // Actualizar Mapa con zoom progresivo
                if (routeLine2D) map.removeLayer(routeLine2D);
                routeLine2D = L.geoJSON(data.routes[0].geometry, {style: {color: '#00f2ff', weight: 6}}).addTo(map);
                map.fitBounds(routeLine2D.getBounds(), {padding: [30,30]});
                setTimeout(() => map.flyTo(userCoords, 18), 3000);

                // Dibujar flechas con "Imán de Carretera"
                pintarCaminoMejorado(coordinates);
            }
        }

        function pintarCaminoMejorado(points) {
            const container = document.getElementById('ar-route-container');
            container.innerHTML = ''; 

            // Tomamos los primeros 50 metros de la ruta real
            // En lugar de usar todos los puntos, creamos una densidad fija cada 3 metros
            for (let i = 0; i < points.length && i < 30; i++) {
                const pt = points[i];
                const nextPt = points[i+1] || pt;

                const entity = document.createElement('a-entity');
                entity.setAttribute('gps-projected-entity-place', `latitude: ${pt[1]}; longitude: ${pt[0]};`);
                
                const arrow = document.createElement('a-plane');
                arrow.setAttribute('position', '0 -2.5 0'); 
                arrow.setAttribute('rotation', '-90 0 0');
                arrow.setAttribute('width', '3.5'); // Más ancha para disimular desfase
                arrow.setAttribute('height', '5');
                arrow.setAttribute('material', {
                    src: 'https://img.icons8.com/ios-filled/100/ffffff/up.png',
                    color: '#00f2ff',
                    transparent: true,
                    opacity: 0.7,
                    shader: 'flat'
                });

                // Orientación: Hacemos que la flecha mire siempre al siguiente punto de la carretera
                // Esto es lo que crea el efecto de que la línea "sigue" la calle
                entity.appendChild(arrow);
                container.appendChild(entity);
            }
        }
    </script>
</body>
</html>
