<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Head Tracking Parallax</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; z-index: 20;
        }
        canvas { display: block; }
        /* Miniatura de la cámara */
        #output_canvas {
            position: absolute; bottom: 20px; left: 20px;
            width: 160px; height: 120px;
            border: 2px solid #00ff88; border-radius: 8px;
            transform: scaleX(-1); /* Espejo */
        }
    </style>
</head>
<body>

    <div id="loading">Cargando Inteligencia Artificial...</div>
    <video id="video" style="display: none;" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- 1. CONFIGURACIÓN DE THREE.JS ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Crear una habitación con textura de rejilla
        const roomGeo = new THREE.BoxGeometry(20, 20, 20);
        const roomMat = new THREE.MeshStandardMaterial({ 
            color: 0x333333, 
            side: THREE.BackSide,
            wireframe: false 
        });
        const room = new THREE.Mesh(roomGeo, roomMat);
        scene.add(room);

        // Añadir una rejilla visual para notar el movimiento
        const grid = new THREE.GridHelper(20, 20, 0x00ff88, 0x444444);
        grid.position.y = -5;
        scene.add(grid);

        // Añadir objetos flotantes (esferas)
        const count = 50;
        for (let i = 0; i < count; i++) {
            const geo = new THREE.SphereGeometry(0.2, 16, 16);
            const mat = new THREE.MeshPhongMaterial({ color: 0x00ff88 });
            const sphere = new THREE.Mesh(geo, mat);
            sphere.position.set(
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 15
            );
            scene.add(sphere);
        }

        // Luces
        const light = new THREE.PointLight(0xffffff, 100, 50);
        light.position.set(0, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.z = 8;

        // --- 2. CONFIGURACIÓN DE MEDIAPIPE ---
        let faceLandmarker;
        const video = document.getElementById("video");
        const loadingDiv = document.getElementById("loading");

        async function initAI() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`
                },
                runningMode: "VIDEO",
                numFaces: 1
            });
            startVideo();
        }

        async function startVideo() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.addEventListener("loadeddata", () => {
                loadingDiv.style.display = "none";
                animate();
            });
        }

        function animate() {
            let startTimeMs = performance.now();
            const results = faceLandmarker.detectForVideo(video, startTimeMs);

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                // Punto de la nariz
                const nose = results.faceLandmarks[0][1];

                // --- LÓGICA DE PARALLAX ---
                // Mapeamos nose.x (0 a 1) a posición de cámara (-5 a 5)
                // Invertimos (0.5 - nose.x) para que el movimiento sea natural (espejo)
                const targetX = (0.5 - nose.x) * 10;
                const targetY = (0.5 - nose.y) * 10;

                // Suavizado (Lerp) para que no tiemble
                camera.position.x += (targetX - camera.position.x) * 0.05;
                camera.position.y += (targetY - camera.position.y) * 0.05;

                // Siempre mirar al centro para crear el efecto ventana
                camera.lookAt(0, 0, 0);
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // Ajuste de ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initAI();
    </script>
</body>
</html>
