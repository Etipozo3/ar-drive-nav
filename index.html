<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR Pro - Dynamic Flow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-top { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; }
        #destination { width: 100%; padding: 14px; border-radius: 25px; border: 2px solid #1a73e8; background: white; font-size: 16px; box-sizing: border-box; }
        
        #map-container { position: fixed; bottom: 15px; right: 15px; width: 150px; height: 150px; border-radius: 20px; border: 3px solid white; z-index: 9999; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        #map { width: 100%; height: 100%; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 11000; display: flex; align-items: center; justify-content: center; }
        button#start-btn { padding: 15px 30px; border-radius: 30px; border: none; background: #1a73e8; color: white; font-weight: bold; }
    </style>
</head>

<body>
    <div id="overlay"><button id="start-btn" onclick="iniciarApp()">INICIAR GPS</button></div>

    <div id="ui-top">
        <input type="text" id="destination" placeholder="¿A dónde vas?">
    </div>

    <div id="map-container"><div id="map"></div></div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-projected-camera rotation-reader></a-camera>
        <a-entity id="ar-route-container"></a-entity>
    </a-scene>

    <script>
        let map, userMarker, destMarker, routeLine2D;
        let userCoords = null;
        let routeActive = false;

        async function iniciarApp() {
            document.getElementById('overlay').style.display = 'none';
            initMap();
            
            navigator.geolocation.watchPosition(pos => {
                userCoords = [pos.coords.latitude, pos.coords.longitude];
                userMarker.setLatLng(userCoords);
                
                // ZOOM DINÁMICO: Si ya hay ruta, mantenemos un zoom de "calle" (18), 
                // pero si acabamos de empezar o no hay ruta, dejamos que fitBounds decida.
                if (!routeActive) {
                    map.setView(userCoords, 16);
                } else {
                    // Si estamos cerca de un giro o moviéndonos, centramos suavemente
                    map.panTo(userCoords);
                }
            }, null, { enableHighAccuracy: true });
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            
            userMarker = L.circleMarker([0, 0], { color: '#1a73e8', radius: 8, fillOpacity: 1 }).addTo(map);
            
            const llegadaIcon = L.icon({
                iconUrl: 'https://cdn-icons-png.flaticon.com/512/1476/1476735.png',
                iconSize: [30, 30], iconAnchor: [15, 30]
            });
            destMarker = L.marker([0, 0], {icon: llegadaIcon}).addTo(map);
        }

        document.getElementById('destination').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                const geoResp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`);
                const geoData = await geoResp.json();
                
                if (geoData.length > 0) {
                    const dLat = geoData[0].lat;
                    const dLon = geoData[0].lon;
                    destMarker.setLatLng([dLat, dLon]);
                    obtenerRuta(dLat, dLon);
                }
            }
        });

        async function obtenerRuta(dLat, dLon) {
            const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${dLon},${dLat}?geometries=geojson&overview=full`;
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.routes.length > 0) {
                const coordinates = data.routes[0].geometry.coordinates;
                routeActive = true;

                // 1. MAPA: Primero alejamos para ver Salida y Llegada
                if (routeLine2D) map.removeLayer(routeLine2D);
                routeLine2D = L.geoJSON(data.routes[0].geometry, {style: {color: '#1a73e8', weight: 6}}).addTo(map);
                
                map.fitBounds(routeLine2D.getBounds(), { padding: [40, 40] });

                // Después de 4 segundos, hacemos zoom a la posición del usuario para ver las calles
                setTimeout(() => {
                    map.setZoom(18, { animate: true });
                }, 4000);

                // 2. AR: Pintar el flujo de flechas
                pintarFlujoFlechas(coordinates);
            }
        }

        function pintarFlujoFlechas(points) {
            const container = document.getElementById('ar-route-container');
            container.innerHTML = '';

            // Tomamos los puntos del camino y creamos flechas entre ellos
            // Limitamos a los puntos más cercanos para no saturar
            const puntosCercanos = points.slice(0, 30); 

            puntosCercanos.forEach((pt, index) => {
                // Creamos una entidad por cada punto de la carretera
                const el = document.createElement('a-entity');
                
                // Posición GPS real del nodo de la carretera
                el.setAttribute('gps-projected-entity-place', `latitude: ${pt[1]}; longitude: ${pt[0]};`);
                
                // Ajustamos para que esté en el suelo
                el.setAttribute('position', `0 -2.5 0`); 
                el.setAttribute('rotation', '-90 0 0');
                el.setAttribute('geometry', { primitive: 'plane', width: 3, height: 4 });
                
                el.setAttribute('material', {
                    src: 'https://img.icons8.com/ios-filled/100/ffffff/up.png',
                    color: '#00f2ff',
                    transparent: true,
                    opacity: 0.8
                });

                // ANIMACIÓN: Flujo constante hacia adelante
                el.setAttribute('animation', {
                    property: 'scale',
                    from: '0.8 0.8 0.8',
                    to: '1.1 1.1 1.1',
                    dur: 1000,
                    dir: 'alternate',
                    loop: true,
                    easing: 'easeInOutQuad'
                });

                container.appendChild(el);
            });
        }
    </script>
</body>
</html>
