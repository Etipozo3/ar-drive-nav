<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nav-AR: Control Total</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #search-container { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 90%; z-index: 2000; }
        #destination { width: 100%; padding: 12px; border-radius: 20px; border: 2px solid #00f2ff; background: rgba(0,0,0,0.8); color: white; outline: none; }
        
        /* GUI AJUSTADA PARA REDMI */
        #gui { 
            position: fixed; top: 70px; left: 10px; 
            background: rgba(0, 15, 25, 0.9); color: #00f2ff; 
            padding: 10px; border-radius: 12px; z-index: 1500; 
            width: 210px; border: 1px solid #00f2ff; font-size: 10px;
        }
        .control-block { margin-bottom: 8px; }
        input[type=range] { width: 100%; accent-color: #00f2ff; margin: 4px 0; }
        .val-display { float: right; color: white; font-weight: bold; }
        
        #minimap-container { position: fixed; bottom: 20px; right: 15px; width: 90px; height: 90px; border-radius: 50%; border: 2px solid #00f2ff; overflow: hidden; z-index: 2000; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="search-container"><input type="text" id="destination" placeholder="Escribe destino..."></div>
    <div id="minimap-container"><div id="map"></div></div>

    <div id="gui">
        <div style="text-align:center; font-weight:bold; margin-bottom:5px;">CALIBRACIÓN DE POSICIÓN</div>
        
        <div class="control-block">
            <label>LATERAL (X) <span id="x-val" class="val-display">0</span></label>
            <input type="range" id="input-x" min="-350" max="350" step="0.2" value="150">
        </div>

        <div class="control-block">
            <label>ROTACIÓN <span id="r-val" class="val-display">0</span></label>
            <input type="range" id="input-r" min="-380" max="380" step="1" value="-180">
        </div>

        <div class="control-block">
            <label>DISTANCIA (Z) <span id="z-val" class="val-display">-20</span></label>
            <input type="range" id="input-z" min="-1000" max="-50" step="1" value="-234">
        </div>

        <div class="control-block">
            <label>ESCALA <span id="s-val" class="val-display">2.0</span></label>
            <input type="range" id="input-s" min="0.5" max="100" step="0.1" value="52">
        </div>

        <div class="control-block">
            <label>ALTURA (Y) <span id="y-val" class="val-display">-4</span></label>
            <input type="range" id="input-y" min="-550" max="50" step="0.2" value="-200">
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera rotation-reader></a-camera>

        <a-entity id="map-rig" position="0 -4 -20" rotation="0 0 0" scale="2 2 2">
            <a-plane id="ground-map" rotation="-90 0 0" width="120" height="120" 
                     material="transparent: true; opacity: 0.4; shader: flat;"></a-plane>
            <a-entity id="neon-path"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        const rig = document.getElementById('map-rig');
        const mapPlane = document.getElementById('ground-map');
        const pathContainer = document.getElementById('neon-path');
        let userCoords = null;
        let leafletMap, userMarker, routeLine2D;

        // Leaflet
        leafletMap = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(leafletMap);
        userMarker = L.circleMarker([0, 0], { color: '#00f2ff', radius: 4 }).addTo(leafletMap);

        // GUI CONTROLS
        const inputs = {
            x: document.getElementById('input-x'),
            y: document.getElementById('input-y'),
            z: document.getElementById('input-z'),
            r: document.getElementById('input-r'),
            s: document.getElementById('input-s')
        };

        function update() {
            rig.setAttribute('position', `${inputs.x.value} ${inputs.y.value} ${inputs.z.value}`);
            rig.setAttribute('rotation', `0 ${inputs.r.value} 0`);
            rig.setAttribute('scale', `${inputs.s.value} ${inputs.s.value} ${inputs.s.value}`);
            
            Object.keys(inputs).forEach(k => {
                document.getElementById(k + '-val').innerText = inputs[k].value;
            });
        }
        Object.values(inputs).forEach(i => i.addEventListener('input', update));

        // GPS
        navigator.geolocation.watchPosition(pos => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            userMarker.setLatLng(userCoords);
            leafletMap.panTo(userCoords);
            const mapUrl = `https://static-maps.yandex.ru/1.x/?ll=${userCoords[1]},${userCoords[0]}&z=15&l=map&size=650,650&theme=dark`;
            mapPlane.setAttribute('material', 'src', mapUrl);
        }, null, {enableHighAccuracy: true});

        document.getElementById('destination').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${e.target.value}`);
                const data = await resp.json();
                if (data.length > 0) dibujarRuta(data[0].lat, data[0].lon);
            }
        });

        async function dibujarRuta(dLat, dLon) {
            pathContainer.innerHTML = '';
            const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${dLon},${dLat}?geometries=geojson&overview=full`;
            const res = await fetch(url);
            const routeData = await res.json();

            if (routeData.routes.length > 0) {
                if (routeLine2D) leafletMap.removeLayer(routeLine2D);
                routeLine2D = L.geoJSON(routeData.routes[0].geometry, {style: {color: '#00f2ff', weight: 4}}).addTo(leafletMap);
                
                const coords = routeData.routes[0].geometry.coordinates;
                // Dibujamos los primeros 30 segmentos para ver curvas con detalle
                for (let i = 0; i < coords.length - 1 && i < 30; i++) {
                    let x1 = (coords[i][0] - userCoords[1]) * 15000;
                    let z1 = (coords[i][1] - userCoords[0]) * -15000;
                    let x2 = (coords[i+1][0] - userCoords[1]) * 15000;
                    let z2 = (coords[i+1][1] - userCoords[0]) * -15000;

                    const segment = document.createElement('a-cylinder');
                    const dx = x2 - x1;
                    const dz = z2 - z1;
                    const distance = Math.sqrt(dx*dx + dz*dz);
                    
                    segment.setAttribute('position', `${(x1+x2)/2} 0.1 ${(z1+z2)/2}`);
                    segment.setAttribute('radius', '0.2');
                    segment.setAttribute('height', distance);
                    segment.setAttribute('rotation', `90 ${Math.atan2(dx, dz) * 180 / Math.PI} 0`);
                    segment.setAttribute('material', 'color: #00f2ff; emissive: #00f2ff; emissiveIntensity: 2');
                    
                    pathContainer.appendChild(segment);
                }
            }
        }
    </script>
</body>
</html>
