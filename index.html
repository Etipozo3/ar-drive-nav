<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Three.js AR Simple</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #video {
            position: fixed; top: 0; left: 0; min-width: 100%; min-height: 100%;
            object-fit: cover; z-index: -1;
        }
        #btn-permiso {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px; font-size: 1.2rem; background: #2ecc71; color: white;
            border: none; border-radius: 10px; cursor: pointer; z-index: 100;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <button id="btn-permiso">ACTIVAR AR</button>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

        let scene, camera, renderer, cube;
        let sensorActivado = false;

        async function iniciarEscena() {
            // 1. Setup Cámara Física (Video)
            const video = document.getElementById('video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("No se pudo acceder a la cámara:", err);
            }

            // 2. Setup Three.js
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 3. Agregar el Cubo
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshNormalMaterial();
            cube = new THREE.Mesh(geometry, material);
            // Lo ponemos a 5 metros de distancia
            cube.position.set(0, 0, 0); 
            scene.add(cube);

            // 4. Escuchar el Giroscopio manualmente
            window.addEventListener('deviceorientation', manejarOrientacion);

            animate();
        }

        function manejarOrientacion(event) {
            if (!event.alpha) return;

            // Convertir grados a radianes
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0; // Z
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;   // X
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0; // Y

            // Aplicar rotación a la cámara para que el mundo se quede "quieto"
            // Nota: Este es un mapeo básico. Los ejes pueden variar según el navegador.
            camera.rotation.set(beta, gamma, alpha, 'YZX');
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Lógica del Botón para Permisos (Especialmente iOS)
        const btn = document.getElementById('btn-permiso');
        btn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Caso iOS
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            btn.style.display = 'none';
                            iniciarEscena();
                        }
                    });
            } else {
                // Android / Otros
                btn.style.display = 'none';
                iniciarEscena();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
