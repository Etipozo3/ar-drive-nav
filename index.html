<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #debug { position: fixed; bottom: 10px; left: 10px; color: lime; background: rgba(0,0,0,0.8); z-index: 2000; font-family: monospace; padding: 10px; font-size: 12px; }
        #ui { position: fixed; top: 10px; width: 100%; text-align: center; z-index: 2000; }
        button { padding: 15px; background: #00f2ff; border: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="debug">Esperando sensores...</div>
    
    <div id="ui">
        <button onclick="solicitarPermisos()">1. DESBLOQUEAR SENSORES</button>
        <button onclick="crearRuta()">2. VER RUTA</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera id="cam" look-controls="magicWindowTrackingEnabled: true; touchEnabled: false;"></a-camera>
        <a-entity id="mundo"></a-entity>
    </a-scene>

    <script>
        const debug = document.getElementById('debug');
        const mundo = document.getElementById('mundo');

        function solicitarPermisos() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', (e) => {
                                debug.innerHTML = `Alpha (Giro): ${Math.round(e.alpha)}<br>Beta (Inclinación): ${Math.round(e.beta)}`;
                            });
                        }
                    });
            } else {
                window.addEventListener('deviceorientation', (e) => {
                    debug.innerHTML = `Giro: ${Math.round(e.alpha)} | Inclinación: ${Math.round(e.beta)}`;
                });
            }
        }

        function crearRuta() {
            mundo.innerHTML = '';
            // Creamos 5 flechas hacia adelante
            for (let i = 1; i <= 5; i++) {
                let f = document.createElement('a-box');
                f.setAttribute('position', `0 -2 ${-i * 4}`); // -2 es el suelo
                f.setAttribute('width', '1'); f.setAttribute('height', '0.1'); f.setAttribute('depth', '2');
                f.setAttribute('color', '#00f2ff');
                mundo.appendChild(f);
            }
            alert("Ruta creada. ¡Gira el móvil para ver si las cajas se quedan quietas!");
        }
    </script>
</body>
</html>
